# This is the only handwritten build-information file. Python derives paths,
# target membership, namespace paths, and dependency order from these values.

[project]
name = "PillowFort"
namespace = "pf"

[graphics]
vulkan_version = "1.3"
frames_in_flight = 2

[modules]
ErrorReporting = []
EngineLoop = ["ErrorReporting"]
WindowInput = ["ErrorReporting"]
GraphicsCommands = ["ErrorReporting"]
VulkanGraphics = [
    "ErrorReporting",
    "WindowInput",
    "GraphicsCommands",
]
DebugPanels = [
    "ErrorReporting",
    "WindowInput",
    "GraphicsCommands",
    "VulkanGraphics",
]

[applications]
SandboxGame = [
    "EngineLoop",
    "WindowInput",
    "GraphicsCommands",
    "VulkanGraphics",
    "DebugPanels",
]
